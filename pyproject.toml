[project]
name = "onepose"
version = "0.1.0"
description = "OnePose, re-engineered for real-time pose estimation (Python 3.12 port)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pytorch-lightning>=2.2,<3",
    "aiohttp>=3.9",
    "redis>=5.0",
    "opencv-python>=4.9",
    # "poselib>=2.0.4",   # uncomment if replacing pydegensac
    "yacs>=0.1.8",
    "einops>=0.7",
    "timm>=0.9",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pycocotools>=2.0.7",
    "wandb>=0.17",
    "rich>=13",
    "natsort>=8.4",
    "transforms3d>=0.4.1",
    "kornia>=0.7",
    "ipython",
    "tqdm",
    "matplotlib",
    "h5py>=3.10",
    "loguru>=0.7",
    "scipy",
    "numba",
    "albumentations>=1.4",
]

[project.optional-dependencies]
dev = ["pylint", "jupyterlab", "ipdb"]

# PyTorch is intentionally left out of `dependencies` above — install it
# separately, pinned to your actual CUDA driver, e.g.:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu124
# The original env pinned cudatoolkit=10.2 via conda; that's obsolete —
# modern PyTorch wheels bundle their own CUDA runtime, so match the wheel
# to your driver, not the other way around.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
